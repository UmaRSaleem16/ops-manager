version: '3'
services:
  flaskapp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: 1
      MYSQL_DATABASE_USER: "root"
      MYSQL_DATABASE_PASSWORD: "password"
      MYSQL_DATABASE_HOST: "host.docker.internal"
      MYSQL_DATABASE_DB: "ops_manager"
      MYSQL_DATABASE_PORT: 3306
    volumes:
      - ./app:/app
    depends_on:
       - mysql
    stdin_open: true
    tty: true

  # ldap:
  #     image: osixia/openldap:1.5.0
  #     container_name: ldap
  #     environment:
  #         - LDAP_ORGANISATION=MeerTest
  #         - LDAP_DOMAIN=MeerTest.com
  #         - "LDAP_BASE_DN=dc=MeerTest,dc=com"
  #         - LDAP_ADMIN_PASSWORD=admin123
  #     ports:
  #         - 389:389
  #         - 636:636
  #     volumes:
  #       - ./ldapusers:/ldapusers

  mysql:
     image: mysql:8.0.26
     command: --default-authentication-plugin=mysql_native_password
     environment:
       MYSQL_ROOT_PASSWORD: password
       MYSQL_DATABASE: ops_manager
     ports:
       - "3306:3306"
     volumes:
       - mysql-data:/var/lib/mysql

volumes:
   mysql-data: