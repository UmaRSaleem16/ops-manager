    <body>
        <script>
            'use strict';

            var classHolder = document.getElementsByTagName("BODY")[0],
                themeSettings = (localStorage.getItem('themeSettings')) ? JSON.parse(localStorage.getItem('themeSettings')) :
                {},
                themeURL = themeSettings.themeURL || '',
                themeOptions = themeSettings.themeOptions || '';
            if (themeSettings.themeOptions)
            {
                classHolder.className = themeSettings.themeOptions;
                console.log("%c✔ Theme settings loaded", "color: #148f32");
            }
            else
            {
                console.log("%c✔ Heads up! Theme settings is empty or does not exist, loading default settings...", "color: #ed1c24");
            }
            if (themeSettings.themeURL && !document.getElementById('mytheme'))
            {
                var cssfile = document.createElement('link');
                cssfile.id = 'mytheme';
                cssfile.rel = 'stylesheet';
                cssfile.href = themeURL;
                document.getElementsByTagName('head')[0].appendChild(cssfile);

            }
            else if (themeSettings.themeURL && document.getElementById('mytheme'))
            {
                document.getElementById('mytheme').href = themeSettings.themeURL;
            }
            var saveSettings = function()
            {
                themeSettings.themeOptions = String(classHolder.className).split(/[^\w-]+/).filter(function(item)
                {
                    return /^(nav|header|footer|mod|display)-/i.test(item);
                }).join(' ');
                if (document.getElementById('mytheme'))
                {
                    themeSettings.themeURL = document.getElementById('mytheme').getAttribute("href");
                };
                localStorage.setItem('themeSettings', JSON.stringify(themeSettings));
            }
            var resetSettings = function()
            {
                localStorage.setItem("themeSettings", "");
            }

        </script>

        <script>

            $(function() {
                // setTimeout() function will be fired after page is loaded
                // it will wait for 5 sec. and then will fire
                // $("#successMessage").hide() function
                setTimeout(function() {
                    $(".flash-alert").hide(1500)
                }, 10000);
            });

            $("#js-login-btn").click(function(event)
            {
                var form = $("#js-login")

                if (form[0].checkValidity() === false)
                {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.addClass('was-validated');
            });


            $(document).ready(function () {
                $('.show-password-icon').click(function() {
                    var passwordField = $(this).prev('.password-input');
                    var passwordFieldType = passwordField.attr('type');
                    console.log("I am here")
                    console.log("passwordFieldType =====>>>> ", passwordFieldType)
                    if (passwordFieldType === 'password') {
                        passwordField.attr('type', 'text');
                        $(this).removeClass('fa-eye').addClass('fa-eye-slash');
                    } else {
                        passwordField.attr('type', 'password');
                        $(this).removeClass('fa-eye-slash').addClass('fa-eye');
                    }
                });

                $(document).on('focusout', '.password-field', function() {
                    var password = $(this).val();
                    var validationResult = validatePassword(password);
                    if (!validationResult.valid) {
                        $(this).nextAll('.password-error').html(validationResult.message);
                    } else {
                        $(this).nextAll('.password-error').html('');
                    }
                });

                function validatePassword(password) {
                    // Implement password validation logic
                    if (password.length < 8 || password.length > 20) {
                        return { valid: false, message: 'Password must be 8-20 characters long.' };
                    }
                    if (!/[A-Z]/.test(password)) {
                        return { valid: false, message: 'Password must contain at least one uppercase letter.' };
                    }
                    if (!/[a-z]/.test(password)) {
                        return { valid: false, message: 'Password must contain at least one lowercase letter.' };
                    }
                    if (!/[\W_]/.test(password)) {
                        return { valid: false, message: 'Password must contain at least one special character.' };
                    }
                    return { valid: true };
                }

            });

        </script>
